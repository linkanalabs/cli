name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Legitimidade da tag. Barato e sem Go, então roda antes de qualquer job pesado:
  # tag malformada ou fora da main não chega a gastar a CI.
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag em semver
        run: |
          # Mesma forma aceita pelo scripts/release-verify.sh: as duas decidem o
          # que é tag publicável e têm de concordar, inclusive em prerelease com
          # hífen no identificador (v1.2.3-rc-1), que o semver permite e o
          # goreleaser publica (release.prerelease: auto). O release-preflight.sh
          # é estrito de propósito — ele só deriva X.Y.Z, prerelease é decisão
          # manual.
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "tag fora do padrão vX.Y.Z: $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Tag aponta para commit na main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA não está na origin/main — release só sai de código mergeado" >&2; exit 1; }

  # A mesma CI do dia a dia, reusada: lint, teste com cobertura e build de todos
  # os pacotes. Reusar em vez de copiar os passos evita que o gate da release
  # vire um subconjunto silencioso do que "verde" significa no repositório.
  # Job pulado faz o dependente ser pulado, então a release não sai sem isto.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    name: goreleaser
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Sem este job, um commit do cask que falha no tap deixa o workflow verde e o
  # brew servindo a versão antiga em silêncio.
  verify:
    name: verify
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Artefatos, cask no tap e instalação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-verify.sh "$GITHUB_REF_NAME"
